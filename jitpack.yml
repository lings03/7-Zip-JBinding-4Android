before_install:
  # stick to java21 lts for now
  # upgrade to java25 lts breaks javadoc generation
  - sdk install java 21-tem
  - sdk use java 21-tem
  - sdk list java
jdk:
  - openjdk21
install: |
  ./gradlew --version
  # in case of errors add --stacktrace --debug
  ./gradlew publishReleasePublicationToMavenLocal